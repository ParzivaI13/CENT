<div class="login-container">
  <div class="background-decor">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="glass-card">
    <div class="brand-section">
      <div class="logo-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1 class="brand-title">CENT</h1>
      <p class="brand-tagline">Cargo Efficient Navigator Tool</p>
    </div>

    <h2 class="form-title">{{ isRegistering ? 'Create Account' : 'Welcome Back' }}</h2>
    
    <div *ngIf="errorMessage" class="error-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="auth-form">
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="driver@centcargo.com" required autocomplete="email" [disabled]="isLoading">
          <svg xmlns="http://www.w3.org/2000/svg" class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required autocomplete="current-password" [disabled]="isLoading">
          <svg xmlns="http://www.w3.org/2000/svg" class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ isRegistering ? 'Sign Up' : 'Sign In' }}</span>
        <div *ngIf="isLoading" class="spinner"></div>
      </button>
    </form>



    <div class="auth-toggle">
      <span>{{ isRegistering ? 'Already have an account?' : 'New to CENT?' }}</span>
      <button class="toggle-link" (click)="toggleMode()" [disabled]="isLoading">
        {{ isRegistering ? 'Sign In' : 'Create an account' }}
      </button>
    </div>
  </div>
</div>
